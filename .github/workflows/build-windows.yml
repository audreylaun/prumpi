name: Build Windows Executable

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller Prumpi-World.spec

      - name: List files in dist
        run: |
          dir dist -Recurse
          
      - name: Create zip for release
        run: |
          powershell Compress-Archive -Path dist\Prumpi-World\* -DestinationPath dist\Prumpi-World-Windows.zip

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: prumpi-world-windows
          path: dist\Prumpi-World-Windows.zip

      - name: Upload to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist\Prumpi-World-Windows.zip
          asset_name: Prumpi-World-Windows.zip
          asset_content_type: application/zip
